# NileGov Stack Host Nginx Reverse Proxy Template
# Copy this file to /etc/nginx/sites-available/nilegov and link it to /etc/nginx/sites-enabled/nilegov

# Rate limiting zones to protect login and API endpoints
limit_req_zone $binary_remote_addr zone=nilegov_login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=nilegov_api:10m rate=20r/s;

# Upstream definitions
upstream nilegov-backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream nilegov-socketio {
    server 127.0.0.1:9000;
}

# Redirect HTTP (Port 80) to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nilegov.yourdomain.com; # <-- Replace with your actual domain

    # ACME Let's Encrypt Webroot verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nilegov.yourdomain.com; # <-- Replace with your actual domain

    # SSL Certificates (managed by Let's Encrypt Certbot)
    # These paths are filled in automatically by running: certbot --nginx
    ssl_certificate /etc/letsencrypt/live/nilegov.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nilegov.yourdomain.com/privkey.pem;
    
    # Modern SSL configuration (Mozilla intermediate profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;
    # Enforce HTTPS (HSTS) - Enable after testing
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Max upload size (for attachments and documents)
    client_max_body_size 50m;

    # Logging
    access_log /var/log/nginx/nilegov_access.log combined;
    error_log /var/log/nginx/nilegov_error.log warn;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Real-time WebSockets (Socket.IO)
    location /socket.io {
        proxy_pass http://nilegov-socketio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Real-time needs low timeout
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Static Assets bypass proxy if using volumes (optional, but proxying works perfectly for docker)
    location /assets {
        proxy_pass http://nilegov-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Main Application
    location / {
        proxy_pass http://nilegov-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_connect_timeout 3600;

        # Rate limiting rules for security
        limit_req zone=nilegov_api burst=50 nodelay;
    }

    # Strict rate limiting on authentication routes
    location /api/method/login {
        proxy_pass http://nilegov-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        limit_req zone=nilegov_login burst=5 nodelay;
    }
}
