# Consolidated Redis configuration for Cache, Queue, and SocketIO
bind 0.0.0.0
protected-mode no
port 6379

# TCP backlog and timeout
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory management (Optimized for low-resource environments)
maxmemory 128mb
maxmemory-policy allkeys-lru

# Disable heavy persistence (RDB snapshotting is sufficient for cache/queue, save IOPS)
save 900 1
save 300 10
rdbcompression yes
dbfilename dump.rdb
dir /data

# Disable Append Only File (AOF) to reduce write cycles on simple SSDs
appendonly no
