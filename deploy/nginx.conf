##############################################################################
# NileGov Stack — Production Nginx Configuration
# Deploy: cp deploy/nginx.conf /etc/nginx/sites-available/nilegov
#         ln -sf /etc/nginx/sites-available/nilegov /etc/nginx/sites-enabled/nilegov
##############################################################################

# Rate-limiting zones
limit_req_zone $binary_remote_addr zone=nilegov_api:10m    rate=30r/s;
limit_req_zone $binary_remote_addr zone=nilegov_upload:10m rate=5r/s;

# ─── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS main server ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN_PLACEHOLDER;

    # SSL — managed by Certbot (run deploy/ssl.sh after DNS is live)
    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"             always;
    add_header X-Content-Type-Options    "nosniff"                always;
    add_header X-XSS-Protection          "1; mode=block"          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;
    # Enable HSTS only after confirming HTTPS works end-to-end:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Logging
    access_log /var/log/nginx/nilegov_access.log combined;
    error_log  /var/log/nginx/nilegov_error.log  warn;

    # Upload limit (documents up to 10 MB)
    client_max_body_size 12M;

    # Gzip compression
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss
                    application/atom+xml image/svg+xml;

    # ── PWA service worker — never cache ────────────────────────────────────
    location = /sw.js {
        root       /opt/nilegov/client/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        expires    0;
    }

    # ── Vite hashed assets — cache forever (content-addressed filenames) ────
    location /assets/ {
        root       /opt/nilegov/client/dist;
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── PWA manifest & icons — short cache ──────────────────────────────────
    location ~* \.(webmanifest|ico|svg|png)$ {
        root       /opt/nilegov/client/dist;
        expires    7d;
        add_header Cache-Control "public";
    }

    # ── Workbox runtime chunks ───────────────────────────────────────────────
    location /workbox- {
        root       /opt/nilegov/client/dist;
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── API — proxy to Node.js backend ──────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        limit_req zone=nilegov_api burst=60 nodelay;
    }

    # ── File uploads served by Node (multer-managed) ────────────────────────
    location /uploads/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        limit_req zone=nilegov_upload burst=10 nodelay;
    }

    # ── All other routes → SPA (React Router handles client-side routing) ───
    location / {
        root       /opt/nilegov/client/dist;
        try_files  $uri $uri/ /index.html;
        expires    5m;
        add_header Cache-Control "public";
    }
}
