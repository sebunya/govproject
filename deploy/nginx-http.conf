##############################################################################
# NileGov Stack — HTTP-only Nginx (use this before SSL is configured)
# Once certbot is set up, switch to deploy/nginx.conf
##############################################################################

limit_req_zone $binary_remote_addr zone=nilegov_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/nilegov_access.log combined;
    error_log  /var/log/nginx/nilegov_error.log  warn;

    client_max_body_size 12M;

    gzip            on;
    gzip_vary       on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml;

    location = /sw.js {
        root       /opt/nilegov/client/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires    0;
    }

    location /assets/ {
        root       /opt/nilegov/client/dist;
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /workbox- {
        root       /opt/nilegov/client/dist;
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        limit_req zone=nilegov_api burst=60 nodelay;
    }

    location /uploads/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location / {
        root      /opt/nilegov/client/dist;
        try_files $uri $uri/ /index.html;
        expires   5m;
    }
}
