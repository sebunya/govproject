  <!-- Uganda flag tri-stripe at bottom -->
  <rect x="0" y="156" width="64" height="36" fill="#1A1A1A"/>
  <rect x="64" y="156" width="64" height="36" fill="#F5C000"/>
  <rect x="128" y="156" width="64" height="36" fill="#C8102E"/>
  <!-- "N" in Uganda yellow -->
  <text x="96" y="148" font-family="system-ui,sans-serif" font-weight="800" font-size="120"
        fill="#F5C000" text-anchor="middle" dominant-baseline="auto">N</text>
</svg>
